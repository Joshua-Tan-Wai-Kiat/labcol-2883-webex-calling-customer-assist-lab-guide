site_name: LABCOL-2883 · Webex Calling Customer Assist
site_description: Cisco Live Melbourne 2026 LABCOL-2883 lab guide
site_url: https://cisco-collaboration-labguide.github.io/LABCOL-2883-Webex-Calling-Customer-Assist/
repo_url: https://github.com/cisco-collaboration-labguide/LABCOL-2883-Webex-Calling-Customer-Assist
edit_uri: edit/main/docs/
theme:
  name: material
  font: false
  palette:
  - scheme: default
    primary: custom
    accent: cyan
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - scheme: slate
    primary: custom
    accent: cyan
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.tracking
  - navigation.footer
  - navigation.top
  - toc.integrate
  - search.highlight
  - search.suggest
  - content.action.edit
  - content.code.copy
  logo: assets/cisco-live-logo.png
plugins:
- search
markdown_extensions:
- attr_list
- tables
- toc:
    permalink: true
extra_css:
- stylesheets/extra.css
extra:
  generator: false
nav:
- Home: index.md
- Getting Started:
  - Lab overview: 01-overview.md
  - Learning objectives: learning-objectives.md
  - Lab topology: 02-topology.md
  - 1 · Access your lab: 03-task-1-accessing-your-lab.md
- Migration:
  - 2 · Export CUCM configuration: task-2.md
  - 3 · Prepare Unity Connection files: task-3.md
  - 4 · Access Control Hub: 04-task-4-access-control-hub-2-minutes.md
  - 5 · Prepare the migration: 05-task-5-migrate-auto-attendant-and-call-queue-10-minutes.md
  - 6 · Import auto attendants: 06-task-6-bulk-import-auto-attendant-5-minutes.md
  - 7 · Import call queues: 07-task-7-bulk-import-call-queues-5-minutes.md
- Customer Assist:
  - 8 · Add a supervisor: 08-task-8-add-supervisor-for-customer-assist-5-minutes.md
  - 9 · Configure call queue features: 09-task-9-advance-call-queue-configuration-5-minutes.md
